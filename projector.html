<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPD Projection</title>
  <link rel="icon" type="image/png" href="img/vpd-logo.png" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #fff;
    }
    body.is-fullscreen.controls-idle {
      cursor: none;
    }
    #exit-fullscreen-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.5rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.3s;
    }
    body:not(.is-fullscreen) #exit-fullscreen-btn {
      display: none;
    }
    body.is-fullscreen.controls-idle #exit-fullscreen-btn {
      opacity: 0;
      pointer-events: none;
    }
    #backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }
    #lines {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 92vw;
      max-height: 78vh;
      overflow: hidden;
    }
    #lines p {
      margin: 0 0 0.5em 0;
      line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    #reference {
      position: absolute;
      bottom: 4vh;
      right: 4vw;
      z-index: 1;
      font-size: clamp(1rem, 2vw, 1.6rem);
      color: rgba(255,255,255,0.55);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    #image-slide {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #video-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
    }
    #video-container iframe,
    #video-container video {
      width: 100%;
      height: 100%;
    }
    #idle {
      position: absolute;
      z-index: 1;
      color: rgba(255,255,255,0.15);
      font-size: 1.2rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="lines"></div>
  <div id="reference"></div>
  <img id="image-slide" alt="" />
  <div id="video-container"></div>
  <div id="idle">VPD</div>
  <button type="button" id="exit-fullscreen-btn">✕ Exit fullscreen / Quitter</button>
  <script type="module" src="js/projectorPage.js"></script>
</body>
</html>
